# Brings up Postgres and the backend together. First run:
#   docker compose up -d
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_site
#   docker compose exec web python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolsite
      POSTGRES_USER: schoolsite
      POSTGRES_PASSWORD: schoolsite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn schoolsite.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      SECRET_KEY: dev-insecure-change-me
      DEBUG: "True"
      DATABASE_URL: postgres://schoolsite:schoolsite@db:5432/schoolsite
      FRONTEND_ORIGINS: http://localhost:3000
    volumes:
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
