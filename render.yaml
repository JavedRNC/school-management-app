services:
  - type: web
    name: school-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SCHOOL_TZ
        value: Asia/Kolkata
      - key: SEED_DEMO
        value: "1"
