# F17 · Builds an installable Android APK in the cloud (no computer, no Expo account needed).
# Two environments:
#   main → PROD: "Prangan" app, talks to the live server, published on the "latest-apk" release (website download).
#   test → TEST: "Prangan Test" app, server in mobile/test.json, "test-apk" release. Same rules as dev.
#   dev  → DEV:  "Prangan Dev" app (installs next to the real one), talks to the test server in mobile/dev.json,
#                published on the "dev-apk" release. Skipped until mobile/dev.json has the test server address.
name: Android APK

on:
  push:
    branches: [main, dev, test]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.p.outputs.env }}
      go: ${{ steps.p.outputs.go }}
      api: ${{ steps.p.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"; echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            ENVNAME="${GITHUB_REF_NAME}"            # dev or test
            API=$(node -p "require('./mobile/${ENVNAME}.json').apiUrl || ''")
            echo "env=${ENVNAME}" >> "$GITHUB_OUTPUT"; echo "api=${API}" >> "$GITHUB_OUTPUT"
            if [ -n "$API" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else
              echo "go=no" >> "$GITHUB_OUTPUT"
              echo "::warning::${ENVNAME} app not built: put the ${ENVNAME} server address in mobile/${ENVNAME}.json first."
            fi
          fi

  build:
    needs: plan
    if: needs.plan.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: ${{ needs.plan.outputs.env }}
      DEV_API: ${{ needs.plan.outputs.api }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS packages
        run: npm ci

      - name: Stamp the build number into the app (used for the in-app update prompt)
        run: |
          node -e "
            const fs=require('fs'); const p='app.json'; const j=JSON.parse(fs.readFileSync(p));
            j.expo.android = Object.assign({}, j.expo.android, { versionCode: Number(process.env.GITHUB_RUN_NUMBER) });
            j.expo.extra = Object.assign({}, j.expo.extra, { buildNumber: Number(process.env.GITHUB_RUN_NUMBER) });
            const env = process.env.APP_ENV;                // dev / test: separate apps that install next to the real one
            if (env === 'dev' || env === 'test') {
              const Label = env === 'dev' ? 'Dev' : 'Test';
              j.expo.name = 'Prangan ' + Label; j.expo.scheme = 'prangan-' + env;
              j.expo.android.package = j.expo.android.package + '.' + env;   // com.javedrnc.prangan.dev / .test
              j.expo.extra.apiUrl = process.env.DEV_API; j.expo.extra.appEnv = env;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2));"
          grep -n "buildNumber\|versionCode\|\"name\"\|package\|apiUrl" app.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      # The generated Android project signs release builds with a PUBLIC debug key. With that key anyone could publish a
      # look-alike "update". The private Prangan key lives in two repository secrets (Settings → Secrets → Actions):
      #   ANDROID_KEYSTORE_B64 (the keystore file, base64) and ANDROID_KEYSTORE_PASSWORD.
      - name: Sign with the Prangan release key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/prangan-release.keystore
            node ../.github/scripts/sign-release.js
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          elif [ "$APP_ENV" = "prod" ]; then
            echo "::error::The live Prangan app must be signed with the private key. Add the secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (see docs/operations.md)."
            exit 1
          else
            echo "::warning::${APP_ENV} app signed with the public debug key because the signing secrets are not set. Fine for testing, never for the live app."
          fi

      - name: Version, phone-only CPU types, more build memory
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          sed -i "s/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/" android/gradle.properties
          sed -i "s/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/" android/gradle.properties
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Show who signed the APK
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | tee /tmp/cert.txt | grep -E "Owner|SHA256" || true
          if [ "$APP_ENV" = "prod" ] && grep -qi "Android Debug" /tmp/cert.txt; then
            echo "::error::The live app came out signed with the public debug key — not publishing it."
            exit 1
          fi
          rm -f android/app/prangan-release.keystore

      - name: Name the APK
        run: |
          mkdir -p ../dist
          echo "{\"build\": ${GITHUB_RUN_NUMBER}, \"commit\": \"${GITHUB_SHA}\", \"env\": \"${APP_ENV}\"}" > ../dist/build.json   # the server reads this to offer updates
          if [ "$APP_ENV" = "dev" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ../dist/PranganDev.apk
          elif [ "$APP_ENV" = "test" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk ../dist/PranganTest.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk ../dist/Prangan.apk
          fi
          cat ../dist/build.json
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Prangan-${{ env.APP_ENV }}-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14

      - name: Publish PROD to the "latest-apk" release
        if: env.APP_ENV == 'prod'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Prangan — latest Android app"
          make_latest: true
          body: |
            Build ${{ github.run_number }} from commit ${{ github.sha }}.
            Download **Prangan.apk** below on your Android phone and open it to install (allow "Install unknown apps" for your browser once).
            The app talks to https://school-api-7y80.onrender.com
          files: |
            dist/Prangan.apk
            dist/build.json

      - name: Publish DEV to the "dev-apk" release
        if: env.APP_ENV == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-apk
          target_commitish: dev
          name: "Prangan Dev — test app (not for schools)"
          prerelease: true
          make_latest: false
          body: |
            Build ${{ github.run_number }} from commit ${{ github.sha }} (dev branch).
            Test app: installs next to the real Prangan app and talks to the test server ${{ env.DEV_API }}. Demo data only.
          files: |
            dist/PranganDev.apk
            dist/build.json

      - name: Publish TEST to the "test-apk" release
        if: env.APP_ENV == 'test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk
          target_commitish: test
          name: "Prangan Test — checking before release (not for schools)"
          prerelease: true
          make_latest: false
          body: |
            Build ${{ github.run_number }} from commit ${{ github.sha }} (test branch).
            Test app: installs next to the real Prangan app and talks to the test server ${{ env.DEV_API }}. Demo data only.
          files: |
            dist/PranganTest.apk
            dist/build.json
