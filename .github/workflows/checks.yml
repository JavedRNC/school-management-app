# Runs on every push to dev, test or main and on pull requests: API tests, portal type-check + build, browser tests,
# and the app's type-check + browser tests of its default look (Chalk) on a phone-sized web build.
# A red result here means the change must not be released to the next environment.
name: Checks

on:
  push:
    branches: [dev, test, main]
    paths: ["backend/**", "portal/**", "mobile/**", ".github/workflows/checks.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      - name: API tests (every endpoint must have a successful call in some test)
        working-directory: backend
        env:
          API_ROUTE_GATE: "1"
        run: python -m pytest -q

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Install portal packages
        working-directory: portal
        run: npm ci
      - name: Test case list is up to date (docs/test-cases.md)
        run: python tools/test_cases.py --check
      - name: Browser tests (also type-checks and builds the portal)
        working-directory: portal
        # a browser test that fails once is retried once, so a slow runner does not block a release
        run: python -m pytest e2e -q || python -m pytest e2e -q --last-failed

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Install app packages (+ web-only packages for the test build; never shipped in the APK)
        working-directory: mobile
        run: |
          npm ci
          npm i --no-save --legacy-peer-deps react-native-web@0.21.4 @expo/metro-runtime@58.0.17
      - name: Type-check
        working-directory: mobile
        run: npx tsc --noEmit
      - name: App browser tests (default appearance)
        working-directory: mobile
        run: python -m pytest e2e -q || python -m pytest e2e -q --last-failed
