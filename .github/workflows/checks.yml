# Runs on every push to dev, test or main and on pull requests: API tests, portal type-check + build, browser tests.
# A red result here means the change must not be released to the next environment.
name: Checks

on:
  push:
    branches: [dev, test, main]
    paths: ["backend/**", "portal/**", ".github/workflows/checks.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx
      - name: API tests
        working-directory: backend
        run: python -m pytest -q

  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - name: Install portal packages
        working-directory: portal
        run: npm ci
      - name: Browser tests (also type-checks and builds the portal)
        working-directory: portal
        # a browser test that fails once is retried once, so a slow runner does not block a release
        run: python -m pytest e2e -q || python -m pytest e2e -q --last-failed
