# Read-only check of the demo data on DEV and TEST (tools/checks/demo_data.py). Push any commit to `data-check`.
name: Demo data check (DEV + TEST)

on:
  push:
    branches: [data-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/checks/demo_data.py https://prangan-api-dev.onrender.com https://prangan-api-test.onrender.com
